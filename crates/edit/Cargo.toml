[package]
name = "edit"
version = "0.18.0"  # source: /VERSION (synced by `make sync-version`; do not edit by hand)

edition.workspace = true
license.workspace = true
rust-version.workspace = true

build = "build/main.rs"

[features]
# Debug-only invariant checks scattered through the buffer / measurement /
# render / highlighting layers. Tripped checks write to
# $TMPDIR/edit/log/sanity-YYYYMMDD.log and surface via the statusbar warning
# flash. The macros live in crates/stdext/src/sanity.rs so every crate can use
# them; this forwards to the features that switch them on.
sanity = [
    "gutter/sanity",
    "lsh/sanity",
    "lsh-defs/sanity",
    "stdext/sanity",
    #
]

[dependencies]
gutter.workspace = true
lsh.workspace = true
lsh-defs.workspace = true
polyflag.workspace = true
stdext.workspace = true
argh = "*"
libc = "0.2"
toml-span = { version = "0.7", default-features = false }
version = { git = "https://github.com/lczyk/version", tag = "rust/v0.5.0" }

[build-dependencies]
version = { git = "https://github.com/lczyk/version", tag = "rust/v0.5.0" }
